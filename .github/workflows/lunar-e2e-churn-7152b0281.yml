name: lunar-e2e-churn-7152b0281
on:
  push:
    paths:
      - .github/workflows/lunar-e2e-churn-7152b0281.yml
jobs:
  churn-test:
    name: churn-test-7152b0281
    runs-on: localdev-e2e-test-37470308554-1-github-1-e2e
    steps:
      - name: thread and fork churn under tracing
        run: |
          set -euo pipefail
          tracer_pid=$(awk '/^TracerPid:/{print $2}' /proc/self/status)
          if [ "${tracer_pid:-0}" = "0" ]; then
            echo "ERROR: step is not traced (TracerPid=0); CI agent did not instrument it" >&2
            exit 1
          fi
          echo "confirmed traced by CI agent (TracerPid=$tracer_pid)"

          python3 - <<'PY'
          import subprocess, threading
          def worker(i):
              for _ in range(20):
                  subprocess.run(["/bin/true"], check=True)
              subprocess.run(["/bin/echo", "lunar-e2e-churn-marker-7152b0281", str(i)], check=True)
          threads = [threading.Thread(target=worker, args=(i,)) for i in range(16)]
          for t in threads: t.start()
          for t in threads: t.join()
          print("churn complete")
          PY
