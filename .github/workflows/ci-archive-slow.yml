name: ci-archive-slow
on:
  push:
    branches: [localdev-bender-e2e]
jobs:
  prep:
    runs-on: localdev-bender-e2e
    steps:
      - name: Prep
        run: echo "ci-archive localdev test: slow workflow, prep job"
  wait:
    needs: prep
    runs-on: localdev-bender-e2e
    steps:
      - name: Hold for 150s so this run finishes well after the fast one
        run: |
          for i in $(seq 1 15); do echo "still running ($((i * 10))s)"; sleep 10; done
          date -u
